##############
#
# Execute o mando para migrar o banco:
#
# bundle exec rails db:chatwoot_prepare
#
# Sidekiq dividido en 7 workers:
#   Worker 1 (critical): critical, high, default
#   Worker 2 (events):   events
#   Worker 3 (whatsapp history): whatsapp_history_sync
#   Worker 4 (whatsapp): whatsapp
#   Worker 5 (medium):   medium, mailers, action_mailbox_routing, scheduled_messages
#   Worker 6 (low):      low, scheduled_jobs, deferred, purgable, housekeeping,
#                         async_database_migration, bulk_reindex_low,
#                         active_storage_analysis, active_storage_purge,
#                         action_mailbox_incineration
#   Worker 7 (flow builder): flow_builder
#
# Cada worker escucha solo las colas de su comando (-q), no config/sidekiq.yml:
# una cola nueva de la app necesita un worker que la liste. Desde la versión con
# la cola flow_builder, los flujos de Flow Builder (inicios y reanudaciones) corren
# en el Worker 7, y el tick de flujos programados va en medium (Worker 5).
#
#############

x-variables:
  &default_env
  INSTALLATION_NAME: ExampleChat
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: changemeexamplekey
  FRONTEND_URL: https://app.example.com
  # Motor de voz (opcional, servicio mega_voice): mismo secreto en los dos lados, 32+ caracteres
  VOICE_ENGINE_URL: http://host.docker.internal:8790
  VOICE_ENGINE_SECRET: changeme_voice_engine_secret_32_chars_min
  DEFAULT_LOCALE: en
  FORCE_SSL: "true"
  ENABLE_ACCOUNT_SIGNUP: "false"
  REDIS_URL: redis://example_redis:6379
  POSTGRES_HOST: 123.123.123.123
  POSTGRES_PORT: 5432
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: examplepassword
  POSTGRES_DATABASE: examplechat
  ACTIVE_STORAGE_SERVICE: local
  # Uncomment the following lines to use Amazon S3 for Active Storage
  # ACTIVE_STORAGE_SERVICE: amazon
  # S3_BUCKET_NAME: examplechat.bucket
  # AWS_ACCESS_KEY_ID: EXAMPLEKEY123456
  # AWS_SECRET_ACCESS_KEY: EXAMPLESECRET456789
  # AWS_REGION: us-east-1

  #set force_path_style to true if using minio
  # ACTIVE_STORAGE_SERVICE=s3_compatible
  # STORAGE_BUCKET_NAME=
  # STORAGE_ACCESS_KEY_ID=
  # STORAGE_SECRET_ACCESS_KEY=
  # STORAGE_REGION=nyc3
  # STORAGE_ENDPOINT=https://nyc3.digitaloceanspaces.com
  #set force_path_style to true if using minio
  #STORAGE_FORCE_PATH_STYLE=true

  DIRECT_UPLOADS_ENABLED: "true"
  RAILS_LOG_TO_STDOUT: "true"
  USE_INBOX_AVATAR_FOR_BOT: "true"
  MAILER_SENDER_EMAIL: ExampleChat <noreply@example.com>
  SMTP_DOMAIN: smtp.example.com
  SMTP_ADDRESS: smtp.example.com
  SMTP_PORT: 587
  SMTP_USERNAME: noreply@example.com
  SMTP_PASSWORD: smtpexamplepassword
  SMTP_AUTHENTICATION: login
  SMTP_ENABLE_STARTTLS_AUTO: "true"
  SMTP_OPENSSL_VERIFY_MODE: peer
  MAILER_INBOUND_EMAIL_DOMAIN: example.com
  WEB_CONCURRENCY: 2
  RACK_TIMEOUT_SERVICE_TIMEOUT: 0
  ENABLE_RACK_ATTACK: "false"
  EVENT_DISPATCHER_IN_MAIN_SIDEKIQ: "false"
  WHATSAPP_HISTORY_SYNC_IN_MAIN_SIDEKIQ: "false"
  TZ: UTC
  ENABLE_PUSH_RELAY_SERVER: "true"
  WEBHOOKS_TRIGGER_TIMEOUT: 40
  EVOLUTION_API_URL: https://api.evolution.example.com
  EVOLUTION_ADMIN_TOKEN: exampletoken1234567890
  EVOLUTION_PUBLIC_S3: "false"
  WAHA_API_URL: https://waha.example.com
  WAHA_ADMIN_TOKEN: exampletoken1234567890
  UAZAPI_API_URL: https://demo.uazapi.com
  UAZAPI_ADMIN_TOKEN: exampletoken1234567890
  # SSO activation login
  SSO: "false"

services:
  mega_app:
    image: sendingtk/mega:v5.5.0
    command: sh -c "bundle exec rails db:mega_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    entrypoint: docker/entrypoints/rails.sh
    restart: always
    volumes:
      - examplechat_dat:/app/storage
      ## Branding assets
      # - /opt/branding/mega/manifest.json:/app/public/manifest.json
      # - /opt/branding/mega/favicon.ico:/app/public/favicon.ico
      # - /opt/branding/mega/android-icon-192x192.png:/app/public/android-icon-192x192.png
      # - /opt/branding/mega/apple-icon-57x57.png:/app/public/apple-icon-57x57.png
      # - /opt/branding/mega/apple-icon-60x60.png:/app/public/apple-icon-60x60.png
      # - /opt/branding/mega/apple-icon-72x72.png:/app/public/apple-icon-72x72.png
      # - /opt/branding/mega/apple-icon-76x76.png:/app/public/apple-icon-76x76.png
      # - /opt/branding/mega/apple-icon-114x114.png:/app/public/apple-icon-114x114.png
      # - /opt/branding/mega/apple-icon-120x120.png:/app/public/apple-icon-120x120.png
      # - /opt/branding/mega/apple-icon-144x144.png:/app/public/apple-icon-144x144.png
      # - /opt/branding/mega/apple-icon-152x152.png:/app/public/apple-icon-152x152.png
      # - /opt/branding/mega/apple-icon-180x180.png:/app/public/apple-icon-180x180.png
      # - /opt/branding/mega/favicon-16x16.png:/app/public/favicon-16x16.png
      # - /opt/branding/mega/favicon-32x32.png:/app/public/favicon-32x32.png
      # - /opt/branding/mega/favicon-96x96.png:/app/public/favicon-96x96.png
      # - /opt/branding/mega/favicon-badge-16x16.png:/app/public/favicon-badge-16x16.png
      # - /opt/branding/mega/favicon-badge-32x32.png:/app/public/favicon-badge-32x32.png
      # - /opt/branding/mega/favicon-badge-96x96.png:/app/public/favicon-badge-96x96.png
      # - /opt/branding/mega/brand-assets/logo.svg:/app/public/brand-assets/logo.svg
      # - /opt/branding/mega/brand-assets/logo_dark.svg:/app/public/brand-assets/logo_dark.svg
      # - /opt/branding/mega/brand-assets/logo_thumbnail.svg:/app/public/brand-assets/logo_thumbnail.svg
      # - /opt/branding/mega/brand-assets/logo_thumbnail_dark.svg:/app/public/brand-assets/logo_thumbnail_dark.svg
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    environment:
      <<: *default_env
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "3"
          memory: 2048M
      labels:
        - traefik.enable=true
        - traefik.http.routers.example_app.rule=Host(`app.example.com`)
        - traefik.http.routers.example_app.entrypoints=websecure
        - traefik.http.routers.mega_app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.mega_app.priority=1
        - traefik.http.routers.mega_app.service=mega_app
        - traefik.http.services.mega_app.loadbalancer.server.port=3000
        - traefik.http.services.mega_app.loadbalancer.passHostHeader=true
        - traefik.http.routers.mega_app.middlewares=sslheader
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https

  ##############################################################
  # SIDEKIQ WORKER 1 – CRITICAL
  # Colas: critical, high, default
  # Procesa: mensajes en tiempo real, enrutamiento de
  # conversaciones, webhooks entrantes y asignaciones.
  # EventDispatcherJob queda aislado en el worker events.
  ##############################################################
  mega_sidekiq_critical:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q critical -q high -q default -c 15
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 15
      RAILS_MAX_THREADS: 15
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 2048M

  ##############################################################
  # SIDEKIQ WORKER 2 – EVENTS
  # Colas: events
  # Procesa: EventDispatcherJob (webhooks salientes,
  # automations, notifications, reporting y campañas) fuera de
  # critical para no bloquear el realtime del UI.
  ##############################################################
  mega_sidekiq_events:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q events -c 10
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 10
      SIDEKIQ_EVENTS_CONCURRENCY: 10
      RAILS_MAX_THREADS: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ##############################################################
  # SIDEKIQ WORKER 3 – WHATSAPP HISTORY
  # Colas: whatsapp_history_sync
  # Procesa: importaciones históricas pesadas de WhatsApp y
  # descargas de media histórica, con baja concurrencia para no
  # saturar DB/Redis durante sincronizaciones grandes.
  ##############################################################
  mega_sidekiq_whatsapp_history:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q whatsapp_history_sync -c 2
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 2
      SIDEKIQ_WHATSAPP_HISTORY_CONCURRENCY: 2
      RAILS_MAX_THREADS: 2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ##############################################################
  # SIDEKIQ WORKER 4 – WHATSAPP
  # Colas: whatsapp
  # Procesa: webhooks entrantes de WhatsApp con capacidad dedicada
  # para que campañas y tareas de baja prioridad no retrasen mensajes.
  ##############################################################
  mega_sidekiq_whatsapp:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q whatsapp -c 10
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 10
      SIDEKIQ_WHATSAPP_CONCURRENCY: 10
      RAILS_MAX_THREADS: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ##############################################################
  # SIDEKIQ WORKER 7 – FLOW BUILDER
  # Colas: flow_builder
  # Procesa: los flujos de Flow Builder (inicios y reanudaciones). Un bloque
  # lento (una petición HTTP, una llamada a IA) ocupa un hilo de este worker
  # y no uno de los que envían respuestas y webhooks.
  ##############################################################
  mega_sidekiq_flow_builder:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q flow_builder -c 5
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 5
      SIDEKIQ_FLOW_BUILDER_CONCURRENCY: 5
      FLOW_BUILDER_CODE_CONCURRENCY: 2
      RAILS_MAX_THREADS: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 2048M

  ##############################################################
  # SIDEKIQ WORKER 5 – MEDIUM
  # Colas: medium, mailers, action_mailbox_routing, scheduled_messages
  # Procesa: envío de emails, routing de action_mailbox,
  # mensajes programados y tareas de prioridad media.
  ##############################################################
  mega_sidekiq_medium:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q medium -q mailers -q action_mailbox_routing -q scheduled_messages -c 10
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 10
      RAILS_MAX_THREADS: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ##############################################################
  # SIDEKIQ WORKER 6 – LOW
  # Colas: low, scheduled_jobs, deferred, purgable, housekeeping,
  #        async_database_migration, bulk_reindex_low,
  #        active_storage_analysis, active_storage_purge,
  #        action_mailbox_incineration
  # Procesa: tareas programadas, limpieza, migraciones async,
  # reindexación, análisis/purga de active_storage, incineración
  # de mailbox. Toleran mayor latencia.
  ##############################################################
  mega_sidekiq_low:
    image: sendingtk/mega:v5.5.0
    command: bundle exec sidekiq -q low -q scheduled_jobs -q deferred -q purgable -q housekeeping -q async_database_migration -q bulk_reindex_low -q active_storage_analysis -q active_storage_purge -q action_mailbox_incineration -c 10
    restart: always
    extra_hosts: ## El motor de voz se alcanza en el nodo donde corre la app
      - "host.docker.internal:host-gateway"
    networks:
      - examplenet
    volumes:
      - examplechat_dat:/app/storage
    environment:
      <<: *default_env
      SIDEKIQ_CONCURRENCY: 10
      RAILS_MAX_THREADS: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ## Motor de voz (opcional): lleva el audio de las llamadas de WhatsApp y de las bandejas SIP en el servidor
  ## (espera, transferencias, grabación, menús e IA). Sin este servicio las llamadas siguen en el navegador.
  ## - Usa la misma imagen y versión que la app (una versión de Mega que incluya mega-voice).
  ## - Corre en la red del host: abre en el firewall UDP 10000 hasta 10000 + MEGA_VOICE_UDP_PORTS - 1
  ##   y cierra el 8790 (API de control, solo para Rails).
  ## - Bandejas SIP (FreePBX, 3CX, Asterisk, proveedores SIP): completa MEGA_VOICE_SIP_HOST y abre
  ##   en el firewall 5060 UDP y TCP y el rango UDP de MEGA_VOICE_SIP_RTP_PORTS. Necesita una versión de Mega con SIP.
  ## - En el servidor, una vez: sudo sysctl -w net.core.rmem_max=26214400 net.core.wmem_max=26214400
  ## - Corre en el mismo nodo que la app y Sidekiq (host.docker.internal).
  ## - Después se activa por bandeja: "Audio de llamadas en el servidor".
  mega_voice:
    image: sendingtk/mega:v5.5.0
    entrypoint: ["/usr/local/bin/mega-voice"]
    command: []
    networks:
      - hostnet
    environment:
      MEGA_VOICE_SECRET: changeme_voice_engine_secret_32_chars_min # El mismo valor que VOICE_ENGINE_SECRET
      MEGA_VOICE_EVENTS_URL: https://app.example.com/webhooks/voice_engine
      MEGA_VOICE_UDP_PORTS: 50 # Llamadas simultáneas: abre UDP 10000-10049
      MEGA_VOICE_MAX_CALLS: 50 # Las llamadas de más siguen en el navegador
      ## Bandejas SIP: activan SIP en la instalación (quita estas tres líneas si no lo usás); cada cuenta configura su central en su bandeja
      MEGA_VOICE_SIP_ADDR: ":5060" # Escucha SIP en UDP y TCP
      MEGA_VOICE_SIP_RTP_PORTS: 20000-20099 # Audio SIP, un puerto par por llamada: 50 llamadas
      MEGA_VOICE_SIP_HOST: sip.example.com # IP pública del servidor o un dominio que apunte directo a ella (sin proxy); las centrales y los teléfonos de los agentes lo usan
    stop_grace_period: 1h ## Deja terminar las llamadas en curso al actualizar
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M

  example_redis:
    image: redis:7.4.2
    command: [
        "redis-server",
        "--port",
        "6379",
        # Memoria — dejar 512MB+ de overhead para el proceso
        "--maxmemory",
        "1536mb",
        "--maxmemory-policy",
        "noeviction",
        # Persistencia mínima para Sidekiq (protege jobs encolados)
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--auto-aof-rewrite-percentage",
        "100",
        "--auto-aof-rewrite-min-size",
        "64mb",
        "--save",
        "",
        # Conexiones
        "--tcp-backlog",
        "511",
        "--timeout",
        "300",
        "--tcp-keepalive",
        "60",
        "--maxclients",
        "10000",
        # Diagnósticos (esenciales para troubleshooting)
        "--slowlog-log-slower-than",
        "10000",
        "--slowlog-max-len",
        "128",
        "--latency-monitor-threshold",
        "100",
        # NO usar io-threads con 1 CPU
        # "--io-threads", "4",
        # "--io-threads-do-reads", "yes",
        # Rendimiento
        "--hz",
        "50",
        "--dynamic-hz",
        "yes",
        "--activedefrag",
        "yes",
      ]
    networks:
      - examplenet
    volumes:
      - mega_redis_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 2560M
        reservations:
          memory: 1024M

volumes:
  examplechat_dat:
    external: true
    name: examplechat_dat

  mega_redis_data:
    external: true
    name: mega_redis_data

networks:
  examplenet:
    external: true
    name: examplenet
  hostnet: ## Red del host, para el motor de voz
    external: true
    name: host
